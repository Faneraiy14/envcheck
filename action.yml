name: 'envcheck'
description: 'Звіряє .env із .env.example — блокує деплой/merge, якщо відсутній обовʼязковий ключ або значення порожнє.'
author: 'Faneraiy14'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  env-path:
    description: 'Шлях до .env файлу (у CI зазвичай згенерованого з GitHub Secrets попереднім кроком)'
    required: false
    default: '.env'
  example-path:
    description: 'Шлях до .env.example'
    required: false
    default: '.env.example'
  strict:
    description: 'Провалити перевірку і за зайвих ключів теж, не тільки за відсутніх/порожніх'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Run envcheck
      shell: bash
      run: |
        ARGS="${{ inputs.env-path }} ${{ inputs.example-path }}"
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS="$ARGS --strict"
        fi
        php "${{ github.action_path }}/bin/envcheck" $ARGS
